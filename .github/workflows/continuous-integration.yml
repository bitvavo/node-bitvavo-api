name: Continuous Integration

on: [pull_request]

env:
  NODE_VERSION: 20

jobs:
  validate:
    runs-on: ubuntu-latest-4core
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run format:check
      - run: npm test --coverage
      # sonarcloud scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TEST_COVERAGE }}
        with:
          args: >
            -Dsonar.projectKey=bitvavo_node-bitvavo-api
            -Dsonar.organization=bitvavo
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/e2e/**,**/cypress/**,**/github-trigger/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
